[project]
name = "boston-subway-network"
version = "0.1.0"
description = "Route optimization backend and Processing visualization for the Boston MBTA subway network"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient still uses httpx; harmless for these tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
